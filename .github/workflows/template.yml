name: Template contracts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/template-tests
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-generate@0.26.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: tools/template-tests
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked --offline -- -D warnings
      - run: cargo test --all-targets --all-features --locked --offline
        env:
          CARGO_NET_OFFLINE: 'true'
          RUSTUP_AUTO_INSTALL: '0'
          RUSTC_WRAPPER: ''
          RUSTC_WORKSPACE_WRAPPER: ''

  maintainer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/template-tests
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-generate@0.26.0,cargo-llvm-cov@0.9.1,cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: tools/template-tests
      - name: Prepare locked dependencies and current security data
        run: |
          cargo fetch --locked
          cargo deny fetch db
      - name: Maintainer dependency audit
        run: cargo deny --manifest-path Cargo.toml --config ../../deny.toml --all-features --offline --locked check
      - name: Measure and validate the contract test host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/coverage
          cargo llvm-cov --all-targets --all-features --locked --offline --no-default-ignore-filename-regex --ignore-filename-regex '/rustc/|/registry/src/|/git/checkouts/|/\.rustup/toolchains/|/target/' --json --summary-only --output-path target/coverage/current.json
          cargo run --example compare_coverage --locked --offline -- --validate-host "$PWD" target/coverage/current.json
      - name: Compare a previous compatible contract test host
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          RUSTUP_AUTO_INSTALL: '0'
          RUSTC_WRAPPER: ''
          RUSTC_WORKSPACE_WRAPPER: ''
        run: |
          set -euo pipefail
          current="$PWD"
          repository="$(git rev-parse --show-toplevel)"
          if [[ -n "$PR_BASE" ]]; then
            base="$(git merge-base HEAD "$PR_BASE")"
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            base="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          elif [[ -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            base="$PUSH_BASE"
          else
            echo 'First contract-host measurement; no earlier object to compare.'
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if [[ "$(git rev-list --count HEAD)" == 1 ]]; then
              echo 'Initial one-commit publication; record the validated first measurement.'
              exit 0
            fi
            echo 'The comparison revision is unavailable.' >&2
            exit 1
          fi
          previous="$(mktemp -d)"
          # The contract tests list files with git, so the previous host must be a checkout, not an archive.
          git -C "$repository" worktree add --detach "$previous" "$base"
          if [[ ! -f "$previous/tools/template-tests/tests/template_generation.rs" ]]; then
            echo 'The contract host is a new measurement object.'
            exit 0
          fi
          (
            cd "$previous/tools/template-tests"
            export CARGO_TARGET_DIR="$PWD/target"
            cargo fetch --locked
            cargo llvm-cov --all-targets --all-features --locked --offline --no-default-ignore-filename-regex --ignore-filename-regex '/rustc/|/registry/src/|/git/checkouts/|/\.rustup/toolchains/|/target/' --json --summary-only --output-path "$current/target/coverage/previous.json"
          )
          cargo run --example compare_coverage --locked --offline -- --validate-host "$previous/tools/template-tests" target/coverage/previous.json
          cargo run --example compare_coverage --locked --offline -- target/coverage/previous.json target/coverage/current.json
      - name: Contract coverage artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: template-contract-coverage
          path: tools/template-tests/target/coverage/
          if-no-files-found: error
