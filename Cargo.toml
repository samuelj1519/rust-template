[workspace]
resolver = "3"
members = ["crates/app"]
exclude = ["template", "tools/template-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
module_name_repetitions = "allow"
